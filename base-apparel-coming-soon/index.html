<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/index.css" />
    <script src="./script.js" defer></script>
    <title>Frontend Mentor | Base Apparel coming soon page</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img class="logo" src="./images/logo.svg" alt="Base Apparel" width="158" height="33" />
      </header>

      <picture class="hero">
        <source media="(min-width: 1024px)" srcset="./images/hero-desktop.jpg" />
        <img src="./images/hero-mobile.jpg" alt="" width="375" height="250" />
      </picture>

      <main class="content">
        <h1><span>We're</span> coming soon</h1>
        <p>
          Hello fellow shoppers! We're currently building our new fashion store. Add your email
          below to stay up-to-date with announcements and our launch deals.
        </p>

        <form class="form" novalidate>
          <label class="sr-only" for="email">Email address</label>
          <input
            class="form__input"
            id="email"
            name="email"
            type="email"
            placeholder="Email Address"
            autocomplete="email"
            pattern=".+@.+\..+"
            required
            aria-describedby="email-error"
          />
          <img class="form__error-icon" src="./images/icon-error.svg" alt="" />
          <button class="form__submit" type="submit" aria-label="Submit">
            <img src="./images/icon-arrow.svg" alt="" />
          </button>
          <p class="form__error" id="email-error" aria-live="polite"></p>
        </form>
      </main>

      <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="https://www.frontendmentor.io/profile/elshanx">elshanx</a>.
      </footer>
    </div>
  </body>
</html>
