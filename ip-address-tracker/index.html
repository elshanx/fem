<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />

    <title>Frontend Mentor | IP Address Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="/dist/output.css" />
  </head>
  <body class="flex min-h-dvh flex-col font-rubik">
    <header
      class="min-h-[280px] bg-pattern-mobile bg-cover bg-center px-6 pt-8 md:bg-pattern-desktop"
    >
      <h1 class="mb-6 hidden text-center text-2xl font-medium text-white md:block">
        IP Address Tracker
      </h1>

      <div class="relative mx-auto max-w-5xl">
        <form id="ip-form" class="mx-auto flex max-w-xl" novalidate>
          <label for="ip-input" class="sr-only">Search for any IP address or domain</label>
          <input
            id="ip-input"
            name="ip"
            type="text"
            placeholder="Search for any IP address or domain"
            autocomplete="off"
            class="w-full rounded-l-2xl px-5 py-4 text-base text-very-dark-gray placeholder:text-dark-gray focus:outline-none"
          />
          <button
            type="submit"
            id="submit-btn"
            aria-label="Search"
            class="flex w-12 shrink-0 items-center justify-center rounded-r-2xl bg-black transition-colors hover:bg-very-dark-gray disabled:opacity-60"
          >
            <img src="/images/icon-arrow.svg" alt="" class="h-3.5 w-auto" />
          </button>
        </form>

        <p
          id="form-error"
          class="absolute inset-x-0 top-full mt-3 hidden text-center text-sm font-medium text-white"
          role="alert"
        ></p>

        <section
          class="absolute inset-x-0 top-full z-10 mt-12 flex divide-y divide-dark-gray/20 rounded-2xl bg-white px-8 py-6 text-center shadow-xl md:flex-row md:py-[32px] md:divide-x md:divide-y-0 md:text-left"
        >
          <div class="py-4 md:flex-1 md:py-0 md:pl-8">
            <p class="info-label">IP Address</p>
            <p id="ip-address" class="info-value">—</p>
          </div>
          <div class="py-4 md:flex-1 md:py-0 md:px-8">
            <p class="info-label">Location</p>
            <p id="location" class="info-value">—</p>
          </div>
          <div class="py-4 md:flex-1 md:py-0 md:px-8">
            <p class="info-label">Timezone</p>
            <p class="info-value">UTC <span id="timezone-offset">—</span></p>
          </div>
          <div class="py-4 md:flex-1 md:py-0 md:pl-8">
            <p class="info-label">ISP</p>
            <p id="isp" class="info-value">—</p>
          </div>
        </section>
      </div>
    </header>

    <div id="map" class="min-h-max relative z-0 flex-1"></div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://www.github.com/elshanx">Elshan</a>.
    </footer>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script src="/app.js" defer></script>
  </body>
</html>
