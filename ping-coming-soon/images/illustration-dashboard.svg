<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="782" viewBox="0 0 1280 782">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .dash-card {
        transform-box: fill-box;
        transform-origin: center;
        animation: dash-card 0.6s cubic-bezier(0.22, 1, 0.36, 1) var(--d, 0ms) both;
      }

      .dash-line {
        stroke-dasharray: 1;
        animation: dash-draw 6s ease-out var(--d, 0ms) infinite both;
      }

      .dash-check {
        transform-box: fill-box;
        transform-origin: center;
        animation: dash-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) var(--d, 0ms) both;
      }

      .dash-dot {
        animation: dash-blink 1.8s ease-in-out var(--d, 0ms) infinite;
      }

      .dash-bar {
        animation: dash-shimmer 2.4s ease-in-out var(--d, 0ms) infinite;
      }

      .dash-slide {
        animation: dash-slide 0.8s cubic-bezier(0.22, 1, 0.36, 1) 500ms both;
      }

      .dash-fade {
        animation: dash-fade 1s ease-out 700ms both;
      }
    }

    @keyframes dash-card {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
    }

    @keyframes dash-draw {
      0% {
        stroke-dashoffset: 1;
      }
      25%,
      85% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    @keyframes dash-pop {
      from {
        opacity: 0;
        transform: scale(0);
      }
    }

    @keyframes dash-blink {
      50% {
        opacity: 0.3;
      }
    }

    @keyframes dash-shimmer {
      50% {
        opacity: 0.45;
      }
    }

    @keyframes dash-slide {
      from {
        transform: translateX(-100%);
      }
    }

    @keyframes dash-fade {
      from {
        opacity: 0;
      }
    }
  </style>
